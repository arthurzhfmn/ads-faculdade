<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- importação da fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <!-- fim importação da fonte -->
    <title>Transitions CSS</title>
</head>
<body>
    <!-- Transições com CSS -->
    <header id="topo">
        <div class="logo">
            <div class="simbolo"></div>    
        </div>
        <nav>
            <ul class="menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">Empresas</a></li>
                <li class="submenu">
                    <a href="#">Serviços</a>
                    <ul class="outros-servicos">
                        <li><a href="#">Banho e tosa</a></li>
                        <li><a href="#">Vacinação</a></li>
                        <li><a href="#">Venda de Ração</a></li>
                        <li><a href="#">Castração</a></li>
                    </ul>
                </li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>
    <section class="conteudo">
        <h2>Entendendo as time-functions</h2>
        <input type="checkbox" id="acionar">

        <div class="carros">
            <div class="car">
                Linear
                <img src="images/carroFODA.png" alt="Carro Preto foda">
            </div>
            <div class="car">
                Ease
                <img src="images/carroFODA.png" alt="Carro Preto foda">
            </div>
            <div class="car">
                Ease-in
                <img src="images/carroFODA.png" alt="Carro Preto foda">
            </div>
            <div class="car">
                Ease-out
                <img src="images/carroFODA.png" alt="Carro Preto foda">
            </div>
            <div class="car">
                Personalizado
                <img src="images/carroFODA.png" alt="Carro Preto foda">
            </div>
        </div>

        <div class="galeria">
            <div class="foto">
                <img src="images/inseto.jpg" alt="inseto">
            </div>
        </div>
    </section>


</body>
</html>
