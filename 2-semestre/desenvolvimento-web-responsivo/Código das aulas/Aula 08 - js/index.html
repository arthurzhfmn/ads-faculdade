<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Menus Responsives</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<header>
		<div class="logo">LOGO</div>
		<nav id="nav">
			<ul class="menu">
				<li><a href="#">Home</a></li>
				<li><a href="#">Empresa</a></li>
				<li><a href="#">Cursos</a></li>
				<li><a href="#">Contato</a></li>
				<li class="menu-responsive">
					<a href="#abrir"></a>
				</li>
			</ul>
		</nav>
	</header>
	<aside id="abrir">
		<div class="fechar">
			<a href="#x">X</a>
		</div>
		<nav>
			<ul class="menu-lateral">
				<li><a href="#">Home</a></li>
				<li><a href="#">Empresa</a></li>
				<li><a href="#">Cursos</a></li>
				<li><a href="#">Contato</a></li>				
			</ul>
		</nav>
	</aside>
	<!-- Aparecer depois de clicar no menu -->
	<div class="mask"></div>

	<section id="banner">
		<div class="conteudo">
			<img src="imagens/banner.jpg" alt="Espaço">
		</div>
	</section>

		<script>
			const abrir = document.querySelector("#abrir");
			const bt = document.querySelector(".menu-responsive");
			const fechar = document.querySelector('.mask');

			// Atribuir evento de clique
			bt.addEventListener('click', () => {
				abrir.classList.add('open');
			} )

			// Atribuit evento de fechar ao clicar na class 'mask'
			fechar.addEventListener('click', () => {
				abrir.classList.remove('open');
			})
		</script>

</body>
</html>
